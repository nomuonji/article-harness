[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "article-harness"
version = "0.2.0"
description = "Local Codex editorial manager, parallel workers, independent review, and resumable patch handoff"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
article-harness = "article_harness.__main__:main"

[tool.setuptools.packages.find]
include = ["article_harness*"]
